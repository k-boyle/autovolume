syntax = "proto3";

package autovolume.v1;

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_MOVIE = 1;
  MEDIA_TYPE_SHOW = 2;
  MEDIA_TYPE_SEASON = 3;
}

message MediaItem {
  string rating_key = 1;
  MediaType type = 2;
  // For a season, Plex's name for it, e.g. "Season 2" or "Specials".
  string title = 3;
  int32 year = 4;
  // Backend path, e.g. "/api/img/12345". The frontend appends ?w=&h= to pick a size.
  string thumb_url = 5;
  optional int32 volume = 6;
  // Seasons only.
  string show_rating_key = 7;
  string show_title = 8;
  // Plex's season index; 0 is Specials.
  int32 season_number = 9;
}
